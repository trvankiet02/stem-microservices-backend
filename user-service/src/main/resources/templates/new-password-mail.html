<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            max-width: 250px;
        }
        .message {
            margin-bottom: 15px; /* Reduced margin between paragraphs */
        }
        .verify-text {
            text-align: left;
            margin-bottom: 20px;
        }
        .otp {
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .verify-link {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: #2a9f16;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            max-width: 300px;
            margin: 0 auto;
            border: none;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img
                class="logo"
                src="https://res.cloudinary.com/djzwxw0ao/image/upload/v1696942528/uqbxidtwcdbqn8glt6we.jpg"
                alt="STEM | Education Social Network"
                href="http://localhost:3000/home"
        />
    </div>
    <div class="message">
        <p>Chào bạn,</p>
        <p>
            Quản trị viên vừa <strong>đặt lại mật khẩu</strong> cho tài khoản của bạn trên hệ thống.
        </p>
    </div>
    <div class="verify-text">
        <p>
            Mật khẩu mới của bạn là:
        </p>
    </div>
    <div class="otp">
        <span th:text="${newPassword}"></span>
    </div>
    <div class="footer">
        <p>Copyright &copy; 2023 STEM. All rights reserved.</p>
    </div>
</div>
</body>
</html>
